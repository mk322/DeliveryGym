envs:
  - name: DeliveryBench # registered env name
    n_envs: 32
    data_source: deliverybench # nickname for logging
    seed: [10001, 10128, 1] # validation seeds (different from training)
    max_turns: 10 # max number of interaction turns per episode
    response_length_per_turn: 512 # max response length per turn
    config: # env-specific config
      # base_dir uses default (local vlm_delivery and maps in this package)
      map_name: medium-city-22
      render_mode: text
      max_steps: 15
      prompt_format: free_think
      format_reward: 0
      delivery_reward: 1
      enable_map_images: true
      map_renderer: pil
      map_poi_in_system_prompt: true