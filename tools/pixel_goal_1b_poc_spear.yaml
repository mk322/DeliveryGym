SPEAR:
  LAUNCH_MODE: none
  INSTANCE:
    EDITOR_EXECUTABLE: "<resolved-by-SpearSession>"
    EDITOR_UPROJECT: "<resolved-by-SpearSession>"
    EDITOR_LAUNCH_MODE: editor
    COMMAND_LINE_ARGS:
      RenderOffScreen: null
      resx: 1280
      resy: 720
      nosound: null
      stdout: null
      unattended: null
      nopause: null
      NoSplash: null
      NoUba: null
      NoCompile: null
      NoCompileEditor: null
      notrace: null
      AssetRegistry.DisableDirectoryWatcher: 1
      DDC: NoZenLocalFallback
      # Unused under LAUNCH_MODE: none -- the shell launchers pass their own
      # -LocalDataCachePath. Kept relative so the file carries no machine path.
      LocalDataCachePath: .simworld-ue/Saved/DerivedDataCache
    CLIENT_INTERNAL_TIMEOUT_SECONDS: 1800.0
    INITIALIZE_CLIENT_MAX_TIME_SECONDS: 1800.0
    GET_EDITOR_WAIT_FOR_WORLD_INITIALIZED:
      MAX_TIME_SECONDS: 1800.0
      SLEEP_TIME_SECONDS: 1.0
    GET_EDITOR_WAIT_FOR_ENGINE_IDLE:
      MAX_TIME_SECONDS: 1800.0
      SLEEP_TIME_SECONDS: 1.0
    GET_EDITOR_WARM_UP:
      TIME_SECONDS: 2.0
      NUM_FRAMES: 1
    GET_GAME_WAIT_FOR_WORLD_INITIALIZED:
      MAX_TIME_SECONDS: 1800.0
      SLEEP_TIME_SECONDS: 1.0
    GET_GAME_WAIT_FOR_ENGINE_IDLE:
      MAX_TIME_SECONDS: 1800.0
      SLEEP_TIME_SECONDS: 1.0
    GET_GAME_WARM_UP:
      TIME_SECONDS: 2.0
      NUM_FRAMES: 1
SP_SERVICES:
  RPC_SERVICE:
    RPC_SERVER_PORT: 30128
  INITIALIZE_ENGINE_SERVICE:
    EDITOR_STARTUP_MAP: /Game/CityCore_Paris/Scenes/ParisCity_FinalBlueprints
    GAME_DEFAULT_MAP: /Game/CityCore_Paris/Scenes/ParisCity_FinalBlueprints
    OVERRIDE_EDITOR_STARTUP_MAP: true
    OVERRIDE_GAME_DEFAULT_MAP: true
  WORLD_REGISTRY_SERVICE:
    OVERRIDE_GAME_PAUSED: true
    GAME_PAUSED: false
